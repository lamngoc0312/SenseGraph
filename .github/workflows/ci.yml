name: SenseGraph CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff

      - name: Run Ruff lint checks
        run: python -m ruff check app tests evaluation

      - name: Run Pytest suite (mocked AI, no external secrets required)
        run: python -m pytest -v

      - name: Run evaluation harness dry-run
        run: python -m evaluation.benchmark --mode dry-run
